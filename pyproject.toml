[project]
name = "map-quiz-maker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "ttkbootstrap>=2.0.1",
    "typst>=0.15.0",
]

[project.scripts]
map-quiz-maker = "map_quiz_maker.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/map_quiz_maker"]

[dependency-groups]
dev = [
    "pytest>=8",
]
